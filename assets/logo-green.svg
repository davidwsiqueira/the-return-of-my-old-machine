<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Retro CRT Monitor Frame -->
  <rect x="8" y="12" width="48" height="36" rx="2" fill="#111811" stroke="#42a842" stroke-width="1.5"/>
  
  <!-- CRT Screen Glow -->
  <rect x="12" y="16" width="40" height="28" fill="#0a0d0a"/>
  
  <!-- Terminal Prompt Lines -->
  <line x1="16" y1="22" x2="28" y2="22" stroke="#42a842" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="28" x2="36" y2="28" stroke="#42a842" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="34" x2="24" y2="34" stroke="#42a842" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Blinking Cursor -->
  <rect x="26" y="32" width="2" height="4" fill="#58b858"/>
  
  <!-- Monitor Stand -->
  <rect x="28" y="48" width="8" height="4" fill="#111811" stroke="#42a842" stroke-width="1"/>
  <rect x="24" y="52" width="16" height="2" fill="#111811" stroke="#42a842" stroke-width="1"/>
  
  <!-- Subtle scanlines effect -->
  <line x1="12" y1="20" x2="52" y2="20" stroke="#42a842" stroke-width="0.3" opacity="0.2"/>
  <line x1="12" y1="26" x2="52" y2="26" stroke="#42a842" stroke-width="0.3" opacity="0.2"/>
  <line x1="12" y1="32" x2="52" y2="32" stroke="#42a842" stroke-width="0.3" opacity="0.2"/>
  <line x1="12" y1="38" x2="52" y2="38" stroke="#42a842" stroke-width="0.3" opacity="0.2"/>
</svg>



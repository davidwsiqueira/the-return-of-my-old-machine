# ==================================================
# The Return of My Old Machine
# Documentation Configuration
# ==================================================

site_name: The Return of My Old Machine
site_description: A personal restoration and documentation project focused on reviving an old AMD-based desktop computer, Linux experimentation, and retro computing preservation
site_author: David Willian de Siqueira
site_url: https://davidwsiqueira.github.io/the-return-of-my-old-machine

# Repository (disabled to keep header clean)
# repo_url: https://github.com/davidwsiqueira/the-return-of-my-old-machine
# repo_name: davidwsiqueira/the-return-of-my-old-machine
edit_uri: ""

# Copyright
copyright: Maintained by David Willian de Siqueira

# Theme Configuration
theme:
  name: material
  palette:
    # Force dark mode only - retro terminal aesthetic
    - scheme: slate
      primary: green
      accent: green
  font:
    text: Roboto Mono
    code: Courier New
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  logo: assets/logo-green.svg
  favicon: assets/logo-green.svg
  icon:
    repo: fontawesome/brands/github

# Custom CSS - TROMOM Multi-Theme Architecture
extra_css:
  - stylesheets/base.css
  - stylesheets/tromom-green.css
  - stylesheets/tromom-cyan.css
  - stylesheets/tromom-white.css

# Custom JavaScript - Theme Selector
extra_javascript:
  - javascripts/theme-toggle.js

# Plugins
plugins:
  - search:
      lang: en

# Markdown Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - def_list
  - tables
  - footnotes
  - toc:
      permalink: true

